name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Stage static site files
        run: |
          mkdir -p _site
          cp index.html styles.css app.js rules.js glossary-data.js README.md _site/
          touch _site/.nojekyll

      - name: Validate staged site assets
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          site = Path('_site')

          class Assets(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  asset = attrs.get('src') if tag == 'script' else None
                  if tag == 'link' and 'stylesheet' in attrs.get('rel', '').split():
                      asset = attrs.get('href')
                  if not asset:
                      return
                  url = urlsplit(asset)
                  if url.scheme or url.netloc:
                      return
                  path = site / unquote(url.path).lstrip('/')
                  if not path.is_file():
                      raise SystemExit(f'Missing site asset: {asset}')

          Assets().feed((site / 'index.html').read_text(encoding='utf-8'))
          print('All local scripts and stylesheets are included.')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
